<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a4b1e">
<title>DSA4Kids Heldenbogen</title>
<style>
  :root{
    --bg:#f3e7cf; --paper:#fffaf0; --ink:#2b1d10; --muted:#7b6a55; --line:#d8c7a6;
    --accent:#7a4b1e; --accent-ink:#fff; --good:#2f7d32; --bad:#b3261e; --ap:#6a3fa0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1e1812; --paper:#2a2118; --ink:#f3e7cf; --muted:#b5a487; --line:#4a3b2a; --accent:#d29a5b; --accent-ink:#1e1812; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;font-size:20px;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);display:flex;gap:10px;align-items:center;padding:8px 14px}
  header h1{font-size:22px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .hbtn{background:rgba(255,255,255,.18);border:0;border-radius:12px;padding:10px 14px;color:inherit;min-height:48px}
  .hbtn.on{background:#fff;color:var(--accent)}
  main{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
  section{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
  section h2{margin:0 0 6px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .wide{grid-column:1/-1}
  .row{display:flex;align-items:center;gap:10px;min-height:60px;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .ico{font-size:32px;width:42px;text-align:center}
  .lbl{flex:1}
  .lbl small{display:block;color:var(--muted);font-size:13px}
  .bad .lbl{font-style:italic}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:52px;height:52px;border-radius:50%;border:2px solid var(--accent);background:transparent;font-size:28px;line-height:1;color:var(--accent);padding:0}
  .stepper button:active{background:var(--accent);color:var(--accent-ink)}
  .stepper button:disabled{opacity:.3}
  .val{min-width:54px;text-align:center;font-size:32px;font-weight:bold}
  .val.sm{font-size:26px;min-width:44px;white-space:nowrap}
  .max{color:var(--muted);font-size:18px}
  .stepper button.up,.up{border:0;border-radius:12px;width:auto;font-size:16px;background:var(--ap);color:#fff;border-radius:12px;padding:0 12px;height:52px;font-size:16px;min-width:88px}
  .up:disabled{opacity:.3}
  .stepper button.up{color:#fff;background:var(--ap)}
  .up small{display:block;font-size:12px;opacity:.85}
  .pips{display:flex;gap:6px;flex-wrap:wrap;max-width:300px;justify-content:flex-end}
  .pip{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:transparent;padding:0}
  .pip.full{background:var(--accent)}
  .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%}
  input.txt{font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 4px;width:100%;border-radius:0}
  input.txt:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .head{display:flex;gap:14px;flex-wrap:wrap}
  .head label{flex:1;min-width:200px;color:var(--muted);font-size:14px}
  .head input{font-size:24px}
  textarea{width:100%;min-height:150px;font:inherit;color:inherit;background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
  .portrait{width:110px;height:110px;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;overflow:hidden;background-size:cover;background-position:center;flex:none}
  .topgrid{display:flex;gap:14px;align-items:flex-start}
  .topgrid .stats{flex:1;min-width:0}
  .ap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .apnum{font-size:44px;font-weight:bold;color:var(--ap);min-width:90px;text-align:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:2px solid var(--accent);border-radius:12px;background:transparent;color:var(--accent);padding:0 14px;height:48px;font-size:18px}
  .budget{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
  .budget span{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:14px}
  .budget .over{background:var(--bad);color:#fff}
  .budget .ok{background:var(--good);color:#fff}
  .rules{font-size:16px;line-height:1.5}
  .rules table{border-collapse:collapse}
  .rules td,.rules th{padding:3px 12px 3px 0;text-align:left}
  dialog{border:0;border-radius:20px;background:var(--paper);color:var(--ink);padding:18px;max-width:560px;width:92vw}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  dialog h3{margin:0 0 10px}
  .char{display:flex;gap:8px;align-items:center;margin:6px 0}
  .char button.pick{flex:1;text-align:left;border:2px solid var(--line);background:transparent;border-radius:12px;padding:12px;min-height:56px}
  .char button.pick.cur{border-color:var(--accent);background:var(--bg)}
  .char button.del{border:0;background:transparent;font-size:24px;width:52px;height:52px}
  .btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 16px;height:52px;font-size:18px}
  .btn.sec{background:transparent;border:2px solid var(--accent);color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  /* Smartphone: kein horizontales Scrollen */
  html,body{overflow-x:hidden}
  .lbl{min-width:0}
  input.txt,textarea{min-width:0}
  @media (max-width:600px){
    html,body{font-size:17px}
    header{gap:6px;padding:6px 8px}
    header h1{font-size:18px;min-width:0}
    .hbtn{padding:8px 10px;min-height:44px;font-size:15px;white-space:nowrap}
    main{padding:8px;gap:8px;grid-template-columns:minmax(0,1fr)}
    section{padding:10px;border-radius:14px;min-width:0}
    .row{flex-wrap:wrap;gap:6px 8px;min-height:56px;padding:4px 0}
    .ico{font-size:26px;width:32px}
    .lbl{flex:1 1 110px}
    .stepper{gap:4px;margin-left:auto}
    .stepper button{width:44px;height:44px;font-size:24px}
    .val{min-width:36px;font-size:26px}
    .val.sm{font-size:22px;min-width:36px}
    .stepper button.up,.up{height:44px;min-width:80px;padding:0 8px;font-size:15px}
    .pips{max-width:100%;flex:1 1 100%;justify-content:flex-start}
    .pip{width:30px;height:30px}
    .head label{min-width:0;flex:1 1 100%}
    .head input{font-size:20px}
    .topgrid{flex-direction:column-reverse;align-items:stretch}
    .portrait{width:90px;height:90px;align-self:center}
    .row > .lbl[style*="flex:0 0"]{flex:1 1 90px !important}
    .ap{justify-content:center;width:100%}
    .apnum{font-size:36px;min-width:60px}
    .chip{height:44px;padding:0 12px;font-size:16px}
    .rules{overflow-wrap:anywhere}
    .rules td,.rules th{padding-right:8px}
    dialog{width:94vw;padding:14px}
    dialog .btn{flex:1 1 auto}
  }
  @media print{ header,.stepper button,.up,.btn,.toast{display:none!important} body{background:#fff} }
</style>
</head>
<body>
<header>
  <h1 id="title">Heldenbogen</h1>
  <button class="hbtn" id="modeBtn" title="Zwischen Erstellen und Spielen wechseln"></button>
  <button class="hbtn" id="menuBtn">☰ Helden</button>
</header>
<main id="app"></main>

<dialog id="menu">
  <h3>Helden</h3>
  <div id="charList"></div>
  <div class="chips" style="margin-top:10px">
    <button class="btn" id="newBtn">＋ Neuer Held</button>
    <button class="btn sec" id="expBtn">Sichern</button>
    <button class="btn sec" id="impBtn">Laden</button>
    <button class="btn sec" id="closeMenu">Schliessen</button>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="portraitFile" accept="image/*" hidden>
</dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "dsa4kids.v1";

// ---------- Regelwerk (aus dem Heldenbogen) ----------
const GOOD = [
  {k:"klugheit",      n:"Klugheit",        i:"💡"},
  {k:"geschick",      n:"Geschicklichkeit",i:"🐱"},
  {k:"koerperkraft",  n:"Körperkraft",     i:"✊"},
];
const BAD = [
  {k:"neugier",  n:"Neugier",  i:"👁️"},
  {k:"goldgier", n:"Goldgier", i:"🪙"},
];
const COMBAT = [
  {k:"attacke",   n:"Attacke",   i:"⚔️"},
  {k:"parade",    n:"Parade",    i:"🛡️"},
  {k:"fernkampf", n:"Fernkampf", i:"🏹"},
];
const TALENTS = [
  ["wildnis","Wildnisleben"],["menschen","Menschenkenntnis"],
  ["schleichen","Schleichen"],["tierpflanze","Tier- & Pflanzenkunde"],
  ["sinne","Sinnesschärfe"],["heilkunde","Heilkunde"],
  ["fahrzeug","Fahrzeug lenken"],["lesen","Lesen/Schreiben"],
  ["gassen","Gassenwissen"],["geschichte","Geschichtswissen"],
];
const BUDGET = { gut:34, schlecht:10, talente:60, kampf:30 };
const MAX_ATTR = 18, MAX_TALENT = 18;

// Kosten, um einen Wert auf `neu` zu steigern
function attrCost(neu){ return neu<=14 ? 2 : neu<=16 ? 4 : 8; }
function talentCost(neu){ return attrCost(neu)/2; }
function gabeCost(neu){ return neu*2; }
const POOL_COST = 1;   // 1 AP für je 3 Lebens-/Zauberenergie
const POOL_STEP = 3;

// ---------- State ----------
function blank(){
  const c = { id:String(Date.now()+Math.random()), name:"", typus:"", portrait:"", mode:"create",
    ap:0, geld:"", ausruestung:"", waffe:"", tp:"", gabe:"", gabeStufe:1,
    le:0, leMax:0, ze:0, zeMax:0, glueck:3, glueckMax:3 };
  [...GOOD,...BAD,...COMBAT].forEach(x=>c[x.k]=0);
  TALENTS.forEach(t=>c["t_"+t[0]]=0);
  return c;
}
let db = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.chars && d.chars.length) return d; }catch(e){}
  const c = blank(); return { cur:c.id, chars:[c] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Speichern nicht möglich"); } }
const cur = () => db.chars.find(c=>c.id===db.cur) || db.chars[0];

// ---------- Helfer ----------
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),1800); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sum(c, keys){ return keys.reduce((s,k)=>s+(+c[k]||0),0); }

// ---------- Aktionen ----------
// Wert ändern. Erstellen: frei. Spielen: nur Pools/Glück/AP frei, Rest über "Steigern".
function bump(key, d, max){
  const c = cur(); c[key] = clamp((+c[key]||0)+d, 0, max); save(); render();
}
function raise(key, kind){
  const c = cur();
  const v = +c[key]||0, neu = v+1;
  let cost, max;
  if(kind==="attr"){ cost=attrCost(neu); max=MAX_ATTR; }
  else if(kind==="talent"){ cost=talentCost(neu); max=MAX_TALENT; }
  else if(kind==="gabe"){ cost=gabeCost(neu); max=MAX_ATTR; }
  if(neu>max) return toast("Höher geht nicht");
  if(c.ap<cost) return toast("Zu wenig Abenteuerpunkte");
  c.ap-=cost; c[key]=neu; save(); render();
}
function raisePool(key){
  const c = cur();
  if(c.ap<POOL_COST) return toast("Zu wenig Abenteuerpunkte");
  c.ap-=POOL_COST; c[key]+=POOL_STEP; c[key+"Max"]+=POOL_STEP; save(); render();
}
function setText(key, v){ cur()[key]=v; save(); if(key==="name"||key==="typus") updateTitle(); }
function setMode(m){ cur().mode=m; save(); render(); }

// ---------- Rendering ----------
function stepper(key, max, play, kind, costFn){
  const c = cur(), v = +c[key]||0;
  if(play && kind){
    const cost = costFn(v+1);
    return `<div class="stepper"><span class="val">${v}</span>
      <button class="up" data-raise="${key}" data-kind="${kind}" ${v>=max||c.ap<cost?"disabled":""}>＋ Steigern<small>${v>=max?"max.":cost+" AP"}</small></button></div>`;
  }
  return `<div class="stepper"><button data-bump="${key}" data-d="-1" data-max="${max}" ${v<=0?"disabled":""}>−</button>
    <span class="val">${v}</span>
    <button data-bump="${key}" data-d="1" data-max="${max}" ${v>=max?"disabled":""}>+</button></div>`;
}
function row(icon,label,sub,ctl,cls=""){
  return `<div class="row ${cls}"><div class="ico">${icon}</div><div class="lbl">${label}${sub?`<small>${sub}</small>`:""}</div>${ctl}</div>`;
}
function pool(key, label, icon, color){
  const c=cur(), play=c.mode==="play", v=c[key], m=c[key+"Max"];
  const pct = m? clamp(v/m*100,0,100):0;
  const ctl = play
    ? `<div class="stepper"><button data-pool="${key}" data-d="-1">−</button><span class="val sm">${v}<span class="max"> / ${m}</span></span><button data-pool="${key}" data-d="1">+</button></div>
       <button class="up" data-poolup="${key}" ${c.ap<POOL_COST?"disabled":""}>＋${POOL_STEP}<small>${POOL_COST} AP</small></button>`
    : `<div class="stepper"><button data-poolmax="${key}" data-d="-1">−</button><span class="val sm">${m}</span><button data-poolmax="${key}" data-d="1">+</button></div>`;
  return `<div class="row"><div class="ico">${icon}</div><div class="lbl">${label}<div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>${ctl}</div>`;
}

function render(){
  const c = cur(), play = c.mode==="play";
  updateTitle();
  $("#modeBtn").textContent = play ? "🎲 Spielen" : "✏️ Erstellen";
  $("#modeBtn").classList.toggle("on", play);

  const gut = sum(c, GOOD.map(x=>x.k)), schlecht = sum(c, BAD.map(x=>x.k)),
        tal = sum(c, TALENTS.map(t=>"t_"+t[0])), kampf = sum(c, COMBAT.map(x=>x.k));
  const b = (name,used,max)=>`<span class="${used>max?"over":used===max?"ok":""}">${name}: ${used}/${max}</span>`;
  const budget = play ? "" : `<div class="budget">${b("Gute Eigenschaften",gut,BUDGET.gut)}${b("Schlechte",schlecht,BUDGET.schlecht)}${b("Talente",tal,BUDGET.talente)}${b("AT/PA/FK",kampf,BUDGET.kampf)}</div>`;

  const portrait = `<div class="portrait" id="portrait" style="${c.portrait?`background-image:url(${c.portrait})`:""}">${c.portrait?"":"Portrait / Wappen<br>antippen"}</div>`;

  const glueckPips = Array.from({length:c.glueckMax},(_,i)=>`<button class="pip ${i<c.glueck?"full":""}" data-pip="${i}" aria-label="Glückspunkt"></button>`).join("");

  $("#app").innerHTML = `
  <section class="wide"><div class="head">
    <label>Name<input class="txt" data-text="name" value="${esc(c.name)}" placeholder="Name"></label>
    <label>Typus<input class="txt" data-text="typus" value="${esc(c.typus)}" placeholder="z.B. Zwergin, Elf, Gaukler"></label>
  </div></section>

  <section><h2>Eigenschaften</h2>${budget}
    <div class="topgrid"><div class="stats">
      ${GOOD.map(x=>row(x.i,x.n,"",stepper(x.k,MAX_ATTR,play,"attr",attrCost))).join("")}
      ${BAD.map(x=>row(x.i,x.n,"schlechte Eigenschaft",stepper(x.k,MAX_ATTR,false),"bad")).join("")}
    </div>${portrait}</div>
  </section>

  <section><h2>Energie</h2>
    ${pool("le","Lebensenergie","🩹","var(--bad)")}
    ${pool("ze","Zauberenergie","🪄","var(--ap)")}
    <div class="row"><div class="ico">👍</div><div class="lbl">Glück</div>
      ${play?"":`<div class="stepper"><button data-glmax="-1">−</button><span class="val sm">${c.glueckMax}</span><button data-glmax="1">+</button></div>`}
      <div class="pips">${glueckPips}</div></div>
  </section>

  <section><h2>Kampf</h2>
    <div class="row"><div class="ico">🗡️</div><div class="lbl">Waffe<input class="txt" data-text="waffe" value="${esc(c.waffe)}" placeholder="Name der Waffe"></div>
      <div class="lbl" style="flex:0 0 120px">TP<input class="txt" data-text="tp" value="${esc(c.tp)}" placeholder="z.B. 1W+2"></div></div>
    ${COMBAT.map(x=>row(x.i,x.n,"",stepper(x.k,MAX_ATTR,play,"attr",attrCost))).join("")}
  </section>

  <section><h2>Gabe</h2>
    <div class="row"><div class="ico">⚡</div><div class="lbl">Gabe<input class="txt" data-text="gabe" value="${esc(c.gabe)}" placeholder="z.B. Feuerbann"></div></div>
    ${row("","Stufe","",stepper("gabeStufe",MAX_ATTR,play,"gabe",gabeCost))}
  </section>

  <section class="wide"><h2>Talente</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));column-gap:24px">
    ${TALENTS.map(t=>row("",t[1],"",stepper("t_"+t[0],MAX_TALENT,play,"talent",talentCost))).join("")}
    </div>
  </section>

  <section><h2>Abenteuerpunkte</h2>
    <div class="row"><div class="ico">🎲</div><div class="ap">
      <button class="chip" data-ap="-1">−1</button><button class="chip" data-ap="-5">−5</button>
      <span class="apnum">${c.ap}</span>
      <button class="chip" data-ap="1">+1</button><button class="chip" data-ap="5">+5</button><button class="chip" data-ap="10">+10</button>
    </div></div>
    ${play?"":`<div style="color:var(--muted);font-size:14px">Tipp: Im Modus „Spielen“ kosten Steigerungen automatisch Abenteuerpunkte.</div>`}
  </section>

  <section><h2>Geld &amp; Ausrüstung</h2>
    <div class="row"><div class="ico">🪙</div><div class="lbl">Geld<input class="txt" data-text="geld" value="${esc(c.geld)}" placeholder="z.B. 3 Dukaten, 5 Silbertaler"></div></div>
    <div style="margin-top:8px"><div class="ico" style="display:inline-block;width:auto">🎒</div> Ausrüstung
      <textarea data-text="ausruestung" placeholder="Rucksack, Seil, Fackeln …">${esc(c.ausruestung)}</textarea></div>
  </section>

  <section class="wide rules"><h2>Regeln</h2>
    <table>
      <tr><th>Steigern auf</th><th>Eigenschaft / AT / PA / FK</th><th>Talent</th></tr>
      <tr><td>bis 14</td><td>2 AP</td><td>1 AP</td></tr>
      <tr><td>15 – 16</td><td>4 AP</td><td>2 AP</td></tr>
      <tr><td>17 – 18</td><td>8 AP</td><td>4 AP</td></tr>
    </table>
    <p>Lebens- / Zauberenergie: 1 AP für je 3 Punkte. Gabe: doppelter Wert der neuen Stufe in AP.</p>
    <p>Erstellung: Gute Eigenschaften 34 · Schlechte 10 · Talente 60 · AT/PA/FK 30 · Glück 3 · Gabe 1</p>
  </section>`;
}
function updateTitle(){ const c=cur(); $("#title").textContent = (c.name||"Neuer Held") + (c.typus?` – ${c.typus}`:""); document.title = c.name? c.name+" – Heldenbogen":"DSA4Kids Heldenbogen"; }

// ---------- Events (delegiert) ----------
$("#app").addEventListener("click", e=>{
  const t = e.target.closest("button, #portrait"); if(!t) return;
  const c = cur();
  if(t.id==="portrait") return $("#portraitFile").click();
  if(t.dataset.bump) return bump(t.dataset.bump, +t.dataset.d, +t.dataset.max);
  if(t.dataset.raise) return raise(t.dataset.raise, t.dataset.kind);
  if(t.dataset.pool){ const k=t.dataset.pool; c[k]=clamp(c[k]+ +t.dataset.d,0,c[k+"Max"]); save(); return render(); }
  if(t.dataset.poolmax){ const k=t.dataset.poolmax; c[k+"Max"]=Math.max(0,c[k+"Max"]+ +t.dataset.d); c[k]=c[k+"Max"]; save(); return render(); }
  if(t.dataset.poolup) return raisePool(t.dataset.poolup);
  if(t.dataset.ap){ c.ap=Math.max(0,c.ap+ +t.dataset.ap); save(); return render(); }
  if(t.dataset.glmax){ c.glueckMax=clamp(c.glueckMax+ +t.dataset.glmax,0,12); c.glueck=Math.min(c.glueck,c.glueckMax); if(+t.dataset.glmax>0)c.glueck=c.glueckMax; save(); return render(); }
  if(t.dataset.pip!==undefined){ const i=+t.dataset.pip; c.glueck = (c.glueck===i+1)? i : i+1; save(); return render(); }
});
$("#app").addEventListener("input", e=>{ const k=e.target.dataset.text; if(k) setText(k, e.target.value); });
$("#modeBtn").onclick = ()=> setMode(cur().mode==="play"?"create":"play");

$("#portraitFile").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{ const s=256, cv=document.createElement("canvas"); cv.width=cv.height=s;
    const m=Math.min(img.width,img.height); cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    cur().portrait=cv.toDataURL("image/jpeg",.8); URL.revokeObjectURL(url); save(); render(); };
  img.src=url; e.target.value="";
});

// ---------- Heldenmenü ----------
function renderMenu(){
  $("#charList").innerHTML = db.chars.map(c=>`<div class="char">
    <button class="pick ${c.id===db.cur?"cur":""}" data-id="${c.id}">${esc(c.name||"Neuer Held")} <small style="color:var(--muted)">${esc(c.typus)}</small></button>
    <button class="del" data-del="${c.id}" aria-label="Löschen">🗑️</button></div>`).join("");
}
$("#menuBtn").onclick = ()=>{ renderMenu(); $("#menu").showModal(); };
$("#closeMenu").onclick = ()=>$("#menu").close();
$("#charList").addEventListener("click", e=>{
  const p=e.target.closest(".pick"), d=e.target.closest(".del");
  if(p){ db.cur=p.dataset.id; save(); render(); $("#menu").close(); }
  if(d){ const c=db.chars.find(x=>x.id===d.dataset.del);
    if(confirm(`„${c.name||"Neuer Held"}“ wirklich löschen?`)){
      db.chars=db.chars.filter(x=>x!==c);
      if(!db.chars.length) db.chars.push(blank());
      if(!db.chars.find(x=>x.id===db.cur)) db.cur=db.chars[0].id;
      save(); renderMenu(); render(); } }
});
$("#newBtn").onclick = ()=>{ const c=blank(); db.chars.push(c); db.cur=c.id; save(); render(); $("#menu").close(); };
$("#expBtn").onclick = ()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:"application/json"}));
  a.download="heldenbogen.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("#impBtn").onclick = ()=>$("#file").click();
$("#file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t);
    if(!d.chars||!Array.isArray(d.chars)) throw 0;
    d.chars.forEach(n=>{ const i=db.chars.findIndex(x=>x.id===n.id); i>=0? db.chars[i]=n : db.chars.push(n); });
    save(); render(); renderMenu(); toast("Geladen"); }).catch(()=>toast("Datei nicht lesbar"));
  e.target.value="";
});

render();
</script>
</body>
</html>
